<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Bushfire Estuary Water Quality – Coastal NSW</title>
    <meta name="description" content="What a bushfire would do to water quality in coastal NSW estuaries, from a model built on the 2019–20 fires.">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<body>
